<title>La Cocina del Domingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --surface-2:#E9EEE7; --ink:#18241E; --ink-2:#4B5A52; --line:#D5DDD6;
  --accent:#2E6A4C; --accent-ink:#FFFFFF; --accent-soft:#DCEBE1;
  --apple:#B8322C; --warn:#A8660B; --ok:#2E7D4F;
  --s-carne:#A63D32; --s-pesca:#27667F; --s-fruta:#B7791A; --s-merca:#3C8049;
  --radius:10px;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111814; --surface:#18221C; --surface-2:#1F2B24; --ink:#E6EEE8; --ink-2:#A3B3A9; --line:#2D3B33;
    --accent:#6FBF93; --accent-ink:#0E1A13; --accent-soft:#1E3529;
    --apple:#EE7B72; --warn:#E3A948; --ok:#76C996;
    --s-carne:#E08476; --s-pesca:#6DB5D2; --s-fruta:#E3B25A; --s-merca:#7CC58A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111814; --surface:#18221C; --surface-2:#1F2B24; --ink:#E6EEE8; --ink-2:#A3B3A9; --line:#2D3B33;
  --accent:#6FBF93; --accent-ink:#0E1A13; --accent-soft:#1E3529;
  --apple:#EE7B72; --warn:#E3A948; --ok:#76C996;
  --s-carne:#E08476; --s-pesca:#6DB5D2; --s-fruta:#E3B25A; --s-merca:#7CC58A;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand .where{font-size:.85rem;color:var(--ink-2)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;font-weight:700;color:var(--ink-2);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{display:flex;flex-direction:column;gap:20px;padding-top:18px}
section[hidden]{display:none}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.85rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.banner{border-radius:var(--radius);padding:12px 14px;background:var(--accent-soft);display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.banner.err{background:color-mix(in srgb,var(--apple) 14%,var(--surface))}

/* Week summary */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.stat .v{font-family:var(--display);font-size:1.45rem;font-weight:700}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.over i{background:var(--apple)}
.season{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.85rem}
.chip button{border:0;background:none;padding:0 0 0 2px;color:var(--ink-2);font-size:1rem;line-height:1}

/* Days */
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;background:var(--surface-2)}
.day-h .d{font-family:var(--display);font-weight:700;font-size:1.1rem}
.meals{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:620px){.meals{grid-template-columns:1fr}}
.meal{padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.meals .meal:nth-child(2){border-left:1px solid var(--line)}
@media (max-width:620px){.meals .meal:nth-child(2){border-left:0}}
.meal .plato{font-weight:700;font-size:1.02rem}
.who{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:.9rem}
.who b{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding-top:2px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.tag.batch{background:var(--accent-soft);color:var(--accent)}
.tag.dia{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.tag.libre{background:var(--surface-2);color:var(--ink-2)}
.kidline{padding:8px 14px;border-top:1px dashed var(--line);font-size:.88rem;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap}
.meal.free .plato{color:var(--ink-2);font-style:italic}

/* Shopping */
.shop{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.shop-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-left:6px solid var(--c);flex-wrap:wrap}
.shop-h h3{display:flex;gap:8px;align-items:baseline}
.shop .sec{padding:6px 14px;background:var(--surface-2)}
.item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.item input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);margin:0}
.item .n{font-weight:700}
.item .q{font-size:.85rem;color:var(--ink-2)}
.item.done .n,.item.done .q{text-decoration:line-through;color:var(--ink-2)}
.item.home .n{color:var(--ink-2)}
.item .r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.item .price{font-variant-numeric:tabular-nums}
.item .ref{font-size:.75rem}
.qty{color:var(--ink);font-weight:700}
.as-btn{border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit}
.item .itemtap{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;grid-column:1 / 3;min-height:44px}
.item .itemtap .n,.cart .n{display:block}
.item .itemtap .q{display:block}
.cart .item.as-btn{width:100%;grid-template-columns:28px 1fr auto;padding:9px 14px;border-top:1px solid var(--line);min-height:44px}
.cart .n{display:inline;font-weight:700}
.tick{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:inline-block;position:relative;background:var(--surface)}
.itemtap:hover .tick{border-color:var(--accent)}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:rotate(45deg)}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
#tab-compra{padding-bottom:72px}
.linkbtn{border:0;background:none;color:var(--accent);font-size:.8rem;padding:2px 0;text-decoration:underline}
.spent{display:flex;align-items:center;gap:6px;font-size:.85rem}
.spent input[type=number]{width:82px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:right}

/* Batch */
.step{display:grid;grid-template-columns:28px 64px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:start}
.step:first-child{border-top:0}
.step input{width:22px;height:22px;accent-color:var(--accent);margin:2px 0 0}
.step .t{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.step.done .body{opacity:.55;text-decoration:line-through}
.eq{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.eq span{font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--ink-2)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.where-nevera{color:var(--s-pesca);font-weight:700}
.where-congelador{color:var(--accent);font-weight:700}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:700;font-size:.9rem}
.field .hint{font-size:.82rem;color:var(--ink-2)}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.person{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}
.chipadd{display:flex;gap:6px}
.chipadd input{flex:1}

.person legend{padding:0}
fieldset.person{margin:0;min-width:0}
.person .row label{display:inline-flex;gap:4px;align-items:center}
table.libres td,table.libres th{text-align:center;padding:6px 4px}
table.libres input{width:20px;height:20px;accent-color:var(--accent)}
details.week{border-top:1px solid var(--line);padding-top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mk{font-size:.8rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);min-width:60px}
.mbar i{display:block;height:100%}
.mh,.leyenda .mh{background:var(--s-fruta)} .mp,.leyenda .mp{background:var(--s-carne)} .mg,.leyenda .mg{background:var(--s-pesca)}
.nutri{border-top:1px dashed var(--line);padding:8px 14px;display:flex;flex-direction:column;gap:5px}
.nrow{display:grid;grid-template-columns:minmax(52px,auto) 1fr auto;gap:4px 10px;align-items:center;font-size:.82rem}
.nrow .nname{font-weight:700;color:var(--ink-2)}
.nrow .nk{font-weight:700;text-align:right}
.nrow .nm{grid-column:2 / 4;color:var(--ink-2);font-size:.76rem;margin-top:-2px}
@media (min-width:620px){.nrow{grid-template-columns:90px 1fr 80px 190px}.nrow .nm{grid-column:auto;margin:0;text-align:right}}
.nweek-row{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.nweek .mbar{height:12px;border-radius:6px}
.leyenda{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.switch{display:inline-flex;gap:6px;align-items:center}
.switch input{accent-color:var(--accent);width:18px;height:18px}
.pantry-item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.progress{display:flex;flex-direction:column;gap:6px}
.progress li{list-style:none}
.progress li.now{font-weight:700}
.progress li.done{color:var(--ok)}
.progress ul{padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.hist{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;font-size:.88rem}
.hist .bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hist .bar i{display:block;height:100%;background:var(--accent)}
.hist .bar i.over{background:var(--apple)}
@media (prefers-reduced-motion:no-preference){.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
</style>

<div class="wrap">
<header class="top">
  <div class="brand">
    <h1>La Cocina del Domingo</h1>
    <span class="where" id="subtitulo"></span>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="semana" aria-selected="true">Menú</button>
    <button role="tab" data-tab="compra" aria-selected="false">Compra</button>
    <button role="tab" data-tab="batch" aria-selected="false" id="tab-batch-btn">Día de cocina</button>
    <button role="tab" data-tab="despensa" aria-selected="false">Despensa</button>
    <button role="tab" data-tab="ajustes" aria-selected="false">Tu casa</button>
  </nav>
</header>

<main>
  <div id="notice" hidden></div>

  <section id="tab-semana" class="stack"></section>
  <section id="tab-compra" class="stack" hidden></section>
  <section id="tab-batch" class="stack" hidden></section>
  <section id="tab-despensa" class="stack" hidden></section>
  <section id="tab-ajustes" class="stack" hidden></section>
</main>
</div>

<script>
/* =========================================================
   Datos por defecto (ajustes editables desde la app)
   ========================================================= */
const DEFAULT_CONFIG = {
  v: 2,
  hogar: { nombre: "", ciudad: "", cp: "" },
  personas: [],                 // {id, nombre, edad, dieta, alergias[], noLeGusta[], mediodiaLV: casa|cole|fuera, comidas:{desayuno,comida,merienda,cena}}
  libres: [],                   // ["Sábado-comida", ...]
  presupuesto: 0,
  gastoActual: "",
  diaCompra: "Viernes",
  diaBatch: "Domingo",
  pctBatch: 80,
  tiendas: [{ nombre: "Supermercado", que: "Todo" }],
  superReferencia: "Mercadona",
  comedor: { nombre: "", semanas: [], ref: null },   // semanas: [[lunes..viernes], ...]
  cocina: "",
  notas: ""
};
const NUEVA_PERSONA = () => ({ id: uid(), nombre: "", edad: "", dieta: "", alergias: [], noLeGusta: [], mediodiaLV: "casa", comidas: { desayuno: false, comida: true, merienda: false, cena: true } });
const COLORES = ["var(--s-carne)", "var(--s-pesca)", "var(--s-fruta)", "var(--s-merca)", "var(--accent)", "var(--warn)"];
const DIAS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const SLOTS = ["desayuno", "comida", "merienda", "cena"];
const SLOT_NOMBRE = { desayuno: "Desayuno", comida: "Comida", merienda: "Merienda", cena: "Cena" };

function normalizar(c) {
  const d = Object.assign(structuredClone(DEFAULT_CONFIG), c || {});
  d.hogar = Object.assign({}, DEFAULT_CONFIG.hogar, c?.hogar);
  d.comedor = Object.assign(structuredClone(DEFAULT_CONFIG.comedor), c?.comedor);
  if (!Array.isArray(d.comedor.semanas)) d.comedor.semanas = [];
  if (!Array.isArray(d.personas)) d.personas = [];
  d.personas = d.personas.map(p => Object.assign(NUEVA_PERSONA(), p, { comidas: Object.assign(NUEVA_PERSONA().comidas, p.comidas) }));
  if (!Array.isArray(d.tiendas) || !d.tiendas.length) d.tiendas = structuredClone(DEFAULT_CONFIG.tiendas);
  if (!Array.isArray(d.libres)) d.libres = [];
  return d;
}
function shops() {
  const t = (S.config.tiendas || []).filter(x => x.nombre);
  return (t.length ? t : DEFAULT_CONFIG.tiendas).map((x, i) => ({ id: x.nombre, que: x.que, c: COLORES[i % COLORES.length] }));
}
// Tiendas de ajustes más las que aparezcan en una lista antigua
function shopsConItems(items) {
  const base = shops();
  const extra = [...new Set(items.map(i => i.tienda))].filter(t => t && !base.some(b => b.id === t));
  return base.concat(extra.map((id, k) => ({ id, c: COLORES[(base.length + k) % COLORES.length] })));
}
const nombreDe = id => S.config.personas.find(p => p.id === id)?.nombre || id;
const colegiales = () => S.config.personas.filter(p => p.mediodiaLV === "cole");
const hayComedor = () => (S.config.comedor?.semanas || []).length > 0 && colegiales().length > 0;
function lunesDe(iso) {
  const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.toISOString().slice(0, 10);
}
function semanaComedor(lunes) {
  const com = S.config.comedor || {}; const n = (com.semanas || []).length;
  if (!n) return 0;
  const ref = com.ref;
  if (!ref || !ref.lunes) return 1;
  const w = Math.round((new Date(lunes + "T12:00:00") - new Date(ref.lunes + "T12:00:00")) / 6048e5);
  return ((ref.n - 1 + w) % n + n) % n + 1;
}
function previewComedor(n) {
  const w = S.config.comedor?.semanas?.[n - 1];
  if (!w) return "Esta semana comen en casa también de lunes a viernes.";
  return w.map((x, i) => DIAS[i].slice(0, 2) + ": " + (x.split(" · ")[1] || x)).join(" · ");
}

/* =========================================================
   Semana de ejemplo (se muestra hasta generar la primera)
   ========================================================= */
const EJEMPLO = {
  id: "ejemplo", ejemplo: true, lunes: "2026-09-28", comedorSemana: 1, comedorDias: ["Lentejas con chorizo · Sándwich · Fruta","Macarrones gratinados · Pescado con ensalada · Fruta","Ensaladilla rusa · Pollo al horno con guisantes · Fruta","Arroz integral tres delicias · Pescado con ensalada · Fruta","Sopa · Albóndigas con puré · Yogur"],
  menu: {
    temporada: { verduras:["calabaza","puerro","coliflor","brócoli","pimiento","berenjena","setas","acelga"], frutas:["manzana asturiana","pera","uva","higo","granada","ciruela"], pescados:["bonito del norte (últimas semanas)","merluza","bocarte","chipirón"] },
    dias: [
      { dia:"Lunes", desayunoNino:"Leche con copos de avena y plátano", meriendaNino:"Pan con queso fresco y una pera",
        comida:{ plato:"Crema de calabaza y puerro con huevo cocido", adultos:"Crema + 2 huevos y ensalada verde", nino:"Comedor escolar", origen:"batch", nota:"Calentar la crema" },
        cena:{ plato:"Merluza al horno con verduras asadas", adultos:"Merluza con pimiento y berenjena asados", nino:"Merluza sin espinas con patata panadera", origen:"batch", nota:"Merluza cocinada el domingo, 8 min de horno para calentar" } },
      { dia:"Martes", desayunoNino:"Tostada de pan integral con tomate y aceite, leche", meriendaNino:"Yogur natural con manzana rallada",
        comida:{ plato:"Lentejas estofadas con verduras", adultos:"Lentejas con mucha verdura, sin patata", nino:"Comedor escolar", origen:"batch", nota:"" },
        cena:{ plato:"Tortilla de calabacín y cebolla", adultos:"Tortilla con ensalada de tomate", nino:"Tortilla con pan", origen:"dia", nota:"10 min en sartén" } },
      { dia:"Miércoles", desayunoNino:"Leche con cereales integrales", meriendaNino:"Bocadillo pequeño de jamón cocido y uvas",
        comida:{ plato:"Pollo guisado con setas", adultos:"Pollo con setas y brócoli al vapor", nino:"Comedor escolar", origen:"batch", nota:"" },
        cena:{ plato:"Crema de calabaza (resto del lunes) y bocarte rebozado en freidora", adultos:"Crema + bocartes con ensalada", nino:"Bocartes con un poco de arroz blanco", origen:"dia", nota:"Bocartes limpios de la pescadería, 8 min freidora" } },
      { dia:"Jueves", desayunoNino:"Tostada con aguacate y leche", meriendaNino:"Queso fresco con membrillo y una mandarina",

/* =========================================================
   Almacenamiento: base de datos compartida o, si no está,
   almacenamiento local en este navegador
   ========================================================= */
let db = null, sample = null, shared = false;

const local = (() => {
  const KEY = "cocina-domingo-v1";
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { data = {}; }
  const subs = [];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} subs.forEach(s => s()); };
  return {
    get: p => data[p],
    set: (p, v) => { data[p] = v; save(); },
    update: (p, v) => { data[p] = Object.assign({}, data[p] || {}, v); save(); },
    del: p => { Object.keys(data).forEach(k => { if (k === p || k.startsWith(p + "/")) delete data[k]; }); save(); },
    children: col => Object.keys(data).filter(k => k.startsWith(col + "/") && k.split("/").length === col.split("/").length + 1).map(k => ({ id: k.split("/").pop(), data: data[k] })),
    onChange: fn => subs.push(fn)
  };
})();

const store = {
  async get(path) { if (db) { const d = await db.doc(path).get(); return d.exists ? d.data() : null; } return local.get(path) || null; },
  async set(path, v) { if (db) return db.doc(path).set(v); local.set(path, v); },
  async update(path, v) { if (db) return db.doc(path).update(v); local.update(path, v); },
  async del(path) { if (db) return db.doc(path).delete(); local.del(path); },
  watchDoc(path, cb) {
    if (db) return db.doc(path).onSnapshot(s => cb(s.exists ? s.data() : null), e => showError("No se pudo leer: " + e.message));
    const f = () => cb(local.get(path) || null); local.onChange(f); f();
  },
  watchCol(path, cb) {
    if (db) return db.collection(path).onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, data: d.data() }))), e => showError("No se pudo leer: " + e.message));
    const f = () => cb(local.children(path)); local.onChange(f); f();
  }
};

function catalogoPrecios(menu) {
  const c = S.precios;
  if (!c || !Array.isArray(c.items) || !c.items.length) return "";
  // Solo los productos que tienen que ver con el menú de la semana, para que quepa en la petición
  const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const raiz = w => w.replace(/(es|s)$/, "");
  const claves = new Set(norm(JSON.stringify(menu.dias)).match(/[a-zñ]{4,}/g)?.map(raiz) || []);
  ["huevo","leche","yogur","pan","aceite","fruta","platano","manzana","queso","avena"].forEach(k => claves.add(k));
  const puntuados = c.items.map(x => {
    const palabras = norm(x[0]).match(/[a-zñ]{4,}/g) || [];
    const score = palabras.reduce((a, w) => a + (claves.has(raiz(w)) ? 1 : 0), 0);
    return { x, score };
  }).filter(p => p.score > 0).sort((a, b) => b.score - a.score);
  let txt = "";
  for (const { x } of puntuados) {
    const l = `${x[0]}|${x[1]}|${x[2]}|${x[3]}/${x[4]}\n`;
    if (txt.length + l.length > 36000) break;
    txt += l;
  }
  return txt;
}

- Suma lo que necesitan TODOS los platos de la semana que usan ese ingrediente y da el total exacto en peso o volumen: "cantidad" es un NÚMERO y "unidad" es "g", "kg", "ml", "l" o "ud" (solo "ud" para cosas que se cuentan: huevos, aguacates, limones, barras de pan).
- Fruta, verdura, carne y pescado SIEMPRE en g o kg (p. ej. 1.2 kg de calabaza, 650 g de lomos de merluza, 4 ud de aguacate no; di 4 ud solo si se venden sueltos por unidad y añade el peso aproximado en "formato").
- Usa g por debajo de 1 kg y kg con decimales a partir de 1 kg.
- En "formato" di cómo pedirlo o qué envase coger: en carnicería y pescadería cómo cortarlo ("fileteado fino", "limpio y sin espinas", "en rodajas de 2 cm"); en el supermercado el envase real y cuántos ("2 botes de 400 g", "bandeja de 500 g").

PRECIOS:
- Usa como referencia los precios de ${R.toUpperCase()} para TODO, también para lo que se compre en otras tiendas (carne, pescado, fruta...).
- "precio" = precio de referencia de ${R} por kg (o por l / ud) × cantidad, en euros con 2 decimales. "precioRef" = ese precio por kg, l o ud, y "refUnidad" = "kg", "l" o "ud".
${cat ? `- CATÁLOGO DE MERCADONA (Gijón, actualizado ${S.precios.actualizado}). Formato: nombre|envase|precio envase €|precio de referencia €/unidad. Busca el producto más parecido y usa SU precio; pon "fuente":"mercadona" cuando lo saques de aquí y "fuente":"estimado" si no hay nada parecido:
${cat}` : `- Estima con los precios de ${R} que conozcas (España, ${new Date().getFullYear()}) y pon "fuente":"estimado".`}

Responde SOLO con JSON válido:
{"items":[{"nombre":"...","cantidad":0,"unidad":"g|kg|ml|l|ud","formato":"...","tienda":"${tiendas.join("|")}","seccion":"...","precio":0.0,"precioRef":0.0,"refUnidad":"kg|l|ud","fuente":"mercadona|estimado","para":"plato(s) en que se usa"}],
 "consejos":["2-4 ideas concretas para ahorrar esta semana sin perder calidad"]}`;
}

PERSONAS:

Responde SOLO con JSON: {"libre":false,"plato":"...","servir":{"<id>":"cómo se le sirve"},"origen":"batch|dia","nota":"...","macros":{"<id>":{"kcal":0,"h":0,"p":0,"g":0}}}`;

/* =========================================================
   Generación con IA
   ========================================================= */
async function generarSemana(form) {
  if (!sample) return;
  const lunes = form.lunes;
  const id = lunes;
  // Una semana ya generada no se pisa: hay que desbloquearla a propósito
  const existente = await store.get("semanas/" + id).catch(() => null);
  if (existente) {
    const generandoAhora = existente.estado === "generando" && Date.now() - new Date(existente.generandoDesde).getTime() < 10 * 60e3;
    if (existente.menu || generandoAhora) {
      S.error = generandoAhora
        ? `La semana del ${fechaCorta(id)} se está generando ahora mismo en otro móvil. Espera a que termine.`
        : `La semana del ${fechaCorta(id)} ya tiene plan y está bloqueada para que no se pierda. Si de verdad queréis rehacerla, usa «Rehacer esta semana» al final del menú.`;
      selectSemana(id); return;
    }
  }
  await store.set("semanas/" + id, { lunes, estado: "generando", generandoDesde: new Date().toISOString() });
  const previos = S.semanas.filter(s => s.id !== id).sort((a, b) => b.id.localeCompare(a.id)).slice(0, 2)
    .flatMap(s => (s.data.menu?.dias || []).flatMap(d => [d.comida?.plato, d.cena?.plato])).filter(p => p && p !== "Comida libre");
  S.gen = { paso: 0, pasos: ["Menú de la semana", "Nutrición aproximada", "Lista de la compra por tiendas", "Plan del " + S.config.diaBatch.toLowerCase()], error: null };
  S.error = null; render();
  if (form.comedorSemana) { S.config.comedorRef = { lunes, n: form.comedorSemana }; saveConfig(); }
  try {
    const menu = await sample.json(promptMenu(lunes, form.comedor, form.peticiones, previos), { modelTier: "complex" });
    if (!menu || !Array.isArray(menu.dias) || menu.dias.length !== 7) throw { message: "El menú llegó incompleto. Vuelve a intentarlo." };
    await store.set("semanas/" + id, { lunes, menu, comedor: form.comedor || "", comedorSemana: form.comedorSemana, comedorDias: form.comedorDias || [], peticiones: form.peticiones || "", creada: new Date().toISOString(), estado: "lista", bloqueada: true, gastos: {}, batchHecho: [], compraDesfasada: false });
    S.semanaId = id; S.gen.paso = 1; render();

    await calcularNutricion(id, menu).catch(() => {});   // si falla, la semana sigue adelante
    S.gen.paso = 2; render();

    await generarCompra(id, menu);
    S.gen.paso = 3; render();

    const batch = await sample.json(promptBatch(menu), { modelTier: "complex" });
    await store.update("semanas/" + id, { batch });
    S.gen = null; S.tab = "semana"; render();
  } catch (e) {
    // si ni siquiera llegó el menú, quitar la semana a medio crear
    const doc = await store.get("semanas/" + id).catch(() => null);
    if (doc && !doc.menu) await store.del("semanas/" + id).catch(() => {});
    else if (doc) await store.update("semanas/" + id, { estado: "lista" }).catch(() => {});
    S.gen.error = mensajeIA(e); render();
  }
}

async function rehacerSemana() {
  const s = semanaActual(); if (!s || s.ejemplo) return;
  S.confirm = null;
  for (const i of S.items) await store.del(`semanas/${s.id}/compra/${i.id}`);
  await store.del("semanas/" + s.id);
  S.genOpen = true; S.genLunes = s.id; S.tab = "semana"; render(true);
  window.scrollTo(0, 0);
}

async function generarCompra(id, menu) {
  const res = await sample.json(promptCompra(menu), { modelTier: "complex" });
  const items = Array.isArray(res?.items) ? res.items : [];
  if (!items.length) throw { message: "La lista de la compra llegó vacía. Vuelve a intentarlo." };
  // borrar la lista anterior de esa semana
  const antiguos = (S.semanaId === id ? S.items : []).map(i => i.id);
  for (const oid of antiguos) await store.del(`semanas/${id}/compra/${oid}`);
  const writes = items.map((it, i) => store.set(`semanas/${id}/compra/${String(i).padStart(3, "0")}-${uid()}`, {
    nombre: String(it.nombre || ""), cantidad: fmtCantidad(it.cantidad), unidad: String(it.unidad || ""), formato: String(it.formato || ""),
    precioRef: Number(it.precioRef) || 0, refUnidad: String(it.refUnidad || ""), fuente: it.fuente === "mercadona" ? "mercadona" : "estimado",
    tienda: shops().some(s => s.id === it.tienda) ? it.tienda : shops().at(-1).id, seccion: String(it.seccion || "Otros"),
    precio: Number(it.precio) || 0, para: String(it.para || ""), estado: "pendiente", orden: i
  }));
  await Promise.all(writes);
  await store.update("semanas/" + id, { consejos: Array.isArray(res.consejos) ? res.consejos : [], compraDesfasada: false, estado: "lista" });
}

async function regenerarCompra(confirmado) {
  const s = semanaActual(); if (!s || s.ejemplo || !sample) return;
  if (!confirmado && S.items.some(i => i.estado !== "pendiente")) { S.confirm = "compra"; render(true); return; }
  S.confirm = null;
  S.gen = { paso: 2, pasos: ["Menú de la semana", "Nutrición aproximada", "Lista de la compra por tiendas", "Plan del " + S.config.diaBatch.toLowerCase()], error: null, soloCompra: true }; render();
  try {
    await generarCompra(s.id, s.menu);
    S.gen.paso = 3; render();
    const batch = await sample.json(promptBatch(s.menu), { modelTier: "complex" });
    await store.update("semanas/" + s.id, { batch, batchHecho: [] });
    S.gen = null; render();
  } catch (e) { S.gen.error = mensajeIA(e); render(); }
}

async function calcularNutricion(id, menu) {
  const r = await sample.json(promptNutricion(menu), { modelTier: "default" });
  if (!Array.isArray(r?.dias) || r.dias.length !== 7) throw { message: "La nutrición llegó incompleta. Vuelve a intentarlo." };
  await store.update("semanas/" + id, { nutri: { dias: r.dias } });
}
async function botonNutricion() {
  const s = semanaActual(); if (!s || s.ejemplo || !sample) return;
  S.calcNutri = true; render(true);
  try { await calcularNutricion(s.id, s.menu); } catch (e) { S.error = mensajeIA(e); }
  S.calcNutri = false; render(true);
}

async function cambiarPlato(diaIdx, slot, motivo) {
  const s = semanaActual(); if (!s || s.ejemplo || !sample) return;
  S.swapping = diaIdx + "-" + slot; render();
  try {
    const nuevo = await sample.json(promptCambio(s.menu, diaIdx, slot, motivo), { modelTier: "default", cache: false });
    if (!nuevo?.plato) throw { message: "No llegó un plato válido." };
    const menu = structuredClone(s.menu);
    const macros = nuevo.macros; delete nuevo.macros;
    menu.dias[diaIdx][slot] = nuevo;
    const upd = { menu, compraDesfasada: true };
    if (s.nutri?.dias?.[diaIdx]) { const nutri = structuredClone(s.nutri); nutri.dias[diaIdx][slot] = macros || {}; upd.nutri = nutri; }
    await store.update("semanas/" + s.id, upd);
  } catch (e) { S.error = mensajeIA(e); }
  S.swapping = null; render();
}

async function despensaPorVoz(texto) {
  S.voz = { busy: true, texto }; render(true);
  const actual = S.despensa.map(d => ({ id: d.id, nombre: d.data.nombre, cantidad: d.data.cantidad, lugar: d.data.lugar }));
  let r;
  try {
    if (sample) {
      r = await sample.json(`Gestionas la despensa de una familia. Esto es lo que hay apuntado ahora (JSON): ${JSON.stringify(actual)}

Alguien ha dictado por voz (puede tener errores de transcripción, interprétalos con sentido común):
"""${texto}"""

Traduce lo dictado en cambios. Si dice que algo "se acabó", "no queda" o "ya no hay", quítalo. Si da una nueva cantidad de algo que ya está, cámbiala. Lo nuevo, añádelo. Lugar: "Nevera", "Congelador" o "Despensa" (si no lo dice, deduce el lugar lógico: frescos y lácteos en Nevera, congelados en Congelador, resto en Despensa). Nombres cortos en español con mayúscula inicial, cantidades breves ("6", "medio paquete", "2 bolsas").
Responde SOLO con JSON: {"anadir":[{"nombre":"...","cantidad":"...","lugar":"Nevera|Congelador|Despensa"}],"cambiar":[{"id":"...","cantidad":"..."}],"quitar":["id",...]}`, { modelTier: "quick", cache: false });
    } else {
      // Sin IA: cada trozo separado por comas, "y" o saltos de línea es un producto de la despensa
      r = { anadir: texto.split(/,|\n|\sy\s/).map(x => x.trim()).filter(Boolean).map(n => ({ nombre: n.charAt(0).toUpperCase() + n.slice(1), cantidad: "", lugar: "Despensa" })), cambiar: [], quitar: [] };
    }
    const lugares = ["Nevera", "Congelador", "Despensa"];
    const ids = new Set(actual.map(a => a.id));
    const anadir = (r.anadir || []).filter(a => a && a.nombre);
    const cambiar = (r.cambiar || []).filter(c => c && ids.has(c.id));
    const quitar = (r.quitar || []).filter(id => ids.has(id));
    for (const a of anadir) await store.set("despensa/" + uid(), { nombre: String(a.nombre), cantidad: String(a.cantidad || ""), lugar: lugares.includes(a.lugar) ? a.lugar : "Despensa" });
    for (const c of cambiar) await store.update("despensa/" + c.id, { cantidad: String(c.cantidad || "") });
    for (const id of quitar) await store.del("despensa/" + id);
    const partes = [anadir.length && `${anadir.length} añadidos`, cambiar.length && `${cambiar.length} cambiados`, quitar.length && `${quitar.length} quitados`].filter(Boolean);
    S.voz = partes.length ? { msg: "Hecho: " + partes.join(", ") + "." } : { err: true, msg: "No he encontrado nada que cambiar. Prueba a decirlo de otra forma.", texto };
  } catch (e) {
    S.voz = { err: true, msg: mensajeIA(e), texto };
  }
  render(true);
}

function mensajeIA(e) {
  const c = e?.code;
  if (c === "not_granted") return "No has dado permiso para usar Claude en esta página. Recarga y acepta el aviso para generar menús.";
  if (c === "rate_limited") return "Has hecho muchas peticiones seguidas. Espera un par de minutos y vuelve a intentarlo.";
  if (c === "invalid_json" || c === "empty_completion") return "La respuesta de la IA llegó cortada. Vuelve a intentarlo.";
  if (c === "cancelled") return "Generación cancelada.";
  return e?.message || "Algo falló al generar. Vuelve a intentarlo.";
}

/* =========================================================
   Render
   ========================================================= */
let renderPending = false;
function editando(el) {
  const a = document.activeElement;
  return a && el.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "checkbox" && a.id !== "sel-semana";
}
function render(force) {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
  ["semana","compra","batch","despensa","ajustes"].forEach(t => document.getElementById("tab-" + t).hidden = t !== S.tab);
  const n = document.getElementById("notice");
  let notice = "";
  if (S.error) notice += `<div class="banner err"><span>${esc(S.error)}</span><button class="btn sm" data-act="cerrar-error">Cerrar</button></div>`;
  if (!shared) notice += `<div class="banner warn small"><span>Modo local: los datos se guardan solo en este navegador${sample ? "" : " y la generación con IA no está disponible"}. Ábrela desde claude.ai para compartirla con tu familia y generar menús.</span></div>`;
  n.innerHTML = notice; n.hidden = !notice;
  const h = S.config.hogar || {};
  document.getElementById("subtitulo").textContent = [h.ciudad, S.config.personas.length ? S.config.personas.length + (S.config.personas.length === 1 ? " persona" : " personas") : ""].filter(Boolean).join(" · ");
  document.getElementById("tab-batch-btn").textContent = S.config.diaBatch || "Día de cocina";
  const fn = { semana: renderSemana, compra: renderCompra, batch: renderBatch, despensa: renderDespensa, ajustes: renderAjustes }[S.tab];
  const el = document.getElementById("tab-" + S.tab);
  // No redibujar mientras alguien escribe en un formulario de esta pestaña
  if (!force && editando(el)) { renderPending = true; return; }
  renderPending = false;
  const active = document.activeElement?.id;
  el.innerHTML = fn();
  if (active && force) { const a = document.getElementById(active); if (a && a.tagName === "INPUT" && a.type === "text") a.focus(); }
}
document.addEventListener("focusout", () => setTimeout(() => { if (renderPending && !editando(document.getElementById("tab-" + S.tab))) render(); }, 0));
document.addEventListener("toggle", e => { if (e.target.id === "gen-panel") S.genOpen = e.target.open; }, true);

function selectorSemana() {
  const opts = S.semanas.slice().sort((a, b) => b.id.localeCompare(a.id)).map(s => `<option value="${esc(s.id)}" ${s.id === S.semanaId ? "selected" : ""}>Semana del ${esc(fechaCorta(s.id))}</option>`).join("");
  if (!S.semanas.length) return "";
  return `<select id="sel-semana" aria-label="Semana" style="width:auto">${opts}</select>`;
}

function panelGenerar() {
  if (S.gen) {
    const g = S.gen;
    return `<div class="panel progress"><h2>${g.error ? "No se pudo terminar" : "Preparando la semana…"}</h2>
      <ul>${g.pasos.map((p, i) => `<li class="${i < g.paso ? "done" : i === g.paso && !g.error ? "now" : ""}">${i < g.paso ? "✓" : i === g.paso && !g.error ? '<span class="spin">◌</span>' : "·"} ${esc(p)}</li>`).join("")}</ul>
      ${g.error ? `<p class="muted">${esc(g.error)}</p><div class="row"><button class="btn" data-act="cerrar-gen">Cerrar</button></div>` : `<p class="small muted">Tarda uno o dos minutos. Puedes seguir usando la app.</p>`}</div>`;
  }
  if (!S.config.personas.length) return `<div class="banner"><span><b>Primero, cuéntale a la app quién vive en casa.</b> Solo hay que hacerlo una vez: personas, edades, alergias, comidas libres, tiendas y el menú del cole si lo hay.</span><button class="btn sm primary" data-act="ir-ajustes">Configurar la casa</button></div>`;
  // por defecto, el primer lunes que todavía no tiene plan
  let lunes = S.genLunes || proximoLunes();
  while (!S.genLunes && S.semanas.some(x => x.id === lunes)) { const d = new Date(lunes + "T12:00:00"); d.setDate(d.getDate() + 7); lunes = d.toISOString().slice(0, 10); }
  return `<details class="panel" id="gen-panel" ${(S.genOpen ?? !S.semanas.length) ? "open" : ""}>
    <summary><h2 style="display:inline">Planificar una semana nueva</h2></summary>
    <form id="form-gen" class="stack" style="margin-top:12px">
      <div class="grid2">
        <div class="field"><label for="g-lunes">Semana que empieza el lunes</label><input type="date" id="g-lunes" value="${lunes}" required></div>
        <div class="field"><label for="g-pet">Peticiones para esta semana</label><input type="text" id="g-pet" placeholder="Ej.: queremos fabada el domingo, algo de marisco…"></div>
      </div>
      ${hayComedor() ? `<div class="field"><label for="g-comedor">${esc(S.config.comedor.nombre || "Comedor del cole")} esa semana</label>
        <select id="g-comedor">${S.config.comedor.semanas.map((w, k) => `<option value="${k + 1}" ${k + 1 === semanaComedor(lunes) ? "selected" : ""}>Semana ${k + 1} del menú</option>`).join("")}<option value="0">No hay cole (vacaciones o festivos)</option></select>
        <span class="hint" id="g-comedor-prev">${esc(previewComedor(semanaComedor(lunes)))}</span>
        <span class="hint">La app avanza sola a la semana siguiente del menú. Las cenas de quien come en el cole complementan lo que comió allí.</span></div>` : ""}
      <div class="row"><button class="btn primary" type="submit" ${sample ? "" : "disabled"}>Generar menú, compra y plan del ${esc(S.config.diaBatch.toLowerCase())}</button>
      ${sample ? "" : `<span class="small muted">Necesita abrirse en claude.ai.</span>`}</div>
    </form></details>`;
}

function renderSemana() {
  const s = semanaActual();
  let h = `<div class="row between"><div><span class="label">Semana</span><h2>${s ? (s.ejemplo ? "Ejemplo: semana del " : "Del ") + esc(fechaCorta(s.lunes)) + " al " + esc(fechaCorta(s.lunes, 6)) : "Sin semana"}</h2></div>${selectorSemana()}</div>`;
  h += panelGenerar();
  if (!s) return h;
  if (s.ejemplo) h += `<div class="banner small"><span>Esto es una semana de ejemplo para que veas cómo funciona. Genera la vuestra arriba.</span></div>`;
  if (!s.ejemplo && !s.menu) return h + `<div class="banner"><span><span class="spin">◌</span> Esta semana se está generando${S.gen ? "" : " en otro móvil"}. Aparecerá aquí en uno o dos minutos.</span></div>`;
  if (s.compraDesfasada) h += bannerDesfase("Has cambiado platos: la lista de la compra y el plan del domingo ya no coinciden.", "Rehacer compra y plan");

  const items = itemsActuales().filter(i => i.estado !== "casa");
  const est = items.reduce((a, i) => a + (Number(i.precio) || 0), 0);
  const pres = S.config.presupuesto;
  const nut = s.menu?.nutricion || {};
  h += `<div class="summary">

/* Nutrición: barra de hidratos / proteínas / grasas en proporción a las kcal que aporta cada uno */

function historial() {
  const rows = S.semanas.slice().sort((a, b) => b.id.localeCompare(a.id)).slice(0, 8).map(s => ({ id: s.id, real: Object.values(s.data.gastos || {}).reduce((a, v) => a + (Number(v) || 0), 0) })).filter(r => r.real > 0);
  if (!rows.length) return "";

    ${rows.map(r => `<div class="hist"><span class="num">${esc(fechaCorta(r.id))}</span><div class="bar"><i class="${S.config.presupuesto && r.real > S.config.presupuesto ? "over" : ""}" style="width:${r.real / max * 100}%"></i></div><span class="num" style="text-align:right">${eur(r.real)}</span></div>`).join("")}</div>`;
}

function leerAjustes() {
  const f = document.getElementById("form-ajustes");
  const d = structuredClone(S.draft || S.config);
  if (!f) return d;
  const q = id => f.querySelector("#" + id);
  const v = id => (q(id)?.value ?? "").trim();
  const lista = t => t.split(/[,;\n]/).map(x => x.trim().toLowerCase()).filter(Boolean);
  d.hogar = { nombre: v("a-nombre"), ciudad: v("a-ciudad"), cp: v("a-cp") };
  d.personas = d.personas.map((p, k) => ({ id: p.id, nombre: v(`p-nombre-${k}`), edad: v(`p-edad-${k}`), dieta: v(`p-dieta-${k}`),
    alergias: lista(v(`p-al-${k}`)), noLeGusta: lista(v(`p-ng-${k}`)), mediodiaLV: v(`p-lv-${k}`) || "casa",
    comidas: Object.fromEntries(SLOTS.map(sl => [sl, !!q(`p-${sl}-${k}`)?.checked])) }));
  d.libres = [];
  DIAS.forEach((dia, i) => ["comida", "cena"].forEach(sl => { if (q(`l-${i}-${sl}`)?.checked) d.libres.push(`${dia}-${sl}`); }));
  d.presupuesto = Number(v("a-pres")) || 0; d.gastoActual = v("a-gasto");
  d.diaCompra = v("a-compra") || d.diaCompra; d.diaBatch = v("a-batch") || d.diaBatch;
  d.pctBatch = Math.min(100, Math.max(20, Number(v("a-pct")) || 80));
  d.cocina = v("a-cocina"); d.notas = v("a-notas");
  d.tiendas = d.tiendas.map((t, k) => ({ nombre: v(`t-nombre-${k}`), que: v(`t-que-${k}`) }));
  d.superReferencia = v("a-ref") || "Mercadona";
  d.comedor.nombre = v("co-nombre");
  d.comedor.semanas = d.comedor.semanas.map((w, k) => DIAS.slice(0, 5).map((_, i) => q(`co-${k}-${i}`) ? v(`co-${k}-${i}`) : (w[i] || "")));
  const rn = Number(v("co-ref")), rl = v("co-ref-lunes");
  d.comedor.ref = d.comedor.semanas.length && rl ? { lunes: lunesDe(rl), n: rn || 1 } : d.comedor.ref;
  return d;
}

// pdf.js se carga solo cuando hace falta leer un PDF (el worker va en el hilo principal)
let pdfjsPromise = null;
function cargarScript(src) { return new Promise((ok, ko) => { const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = () => ko({ message: "No se pudo cargar el lector de PDF." }); document.head.appendChild(el); }); }
function cargarPdfJs() {
  if (!pdfjsPromise) pdfjsPromise = (async () => {
    const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    await cargarScript(base + "pdf.min.js");
    await cargarScript(base + "pdf.worker.min.js");
    return window.pdfjsLib;
  })();
  return pdfjsPromise;
}

async function importarComedor(file) {
  S.draft = leerAjustes();
  if (!sample) { S.importMsg = { err: true, msg: "Leer el menú necesita abrir la app en claude.ai." }; render(true); return; }
  S.importMsg = { busy: true, msg: "Leyendo el menú… tarda un minuto." }; render(true);
  try {
    let texto = "", imagenes = [];
    if (/pdf/i.test(file.type) || /\.pdf$/i.test(file.name)) {
      const pdfjs = await cargarPdfJs();
      const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
      const paginas = Math.min(doc.numPages, 4);
      for (let n = 1; n <= paginas; n++) {
        const tc = await (await doc.getPage(n)).getTextContent();
        texto += tc.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join("") + "\n";
      }
      if (texto.replace(/\s/g, "").length < 150) {   // PDF escaneado: se manda como imagen
        texto = "";
        for (let n = 1; n <= paginas; n++) {
          const page = await doc.getPage(n), vp = page.getViewport({ scale: 1.6 });
          const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
          await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
          imagenes.push(await new Promise(ok => cv.toBlob(ok, "image/png")));
        }
      }
    } else if (/^image\//.test(file.type)) imagenes = [file];
    else throw { message: "Sube un PDF o una foto del menú." };
    let opts = { modelTier: "complex", cache: false };
    if (imagenes.length) {
      const lim = await sample.limits().catch(() => ({}));
      if (!lim.images) throw { message: "No he podido leer texto en ese archivo y las imágenes no están disponibles. Prueba con un PDF con texto o escribe el menú a mano." };
      opts.images = imagenes.slice(0, lim.images.maxCount || 4);
    }
    const r = await sample.json(`Esto es el menú de un comedor escolar${texto ? " (texto sacado de un PDF; si estaba en columnas, el orden puede venir mezclado: guíate por los días y los números de menú)" : " (en la imagen)"}. Normalmente es una rotación de varias semanas de lunes a viernes.
Devuelve cada semana con sus 5 días en orden. Cada día como "primer plato · segundo plato · postre" (unidos con " · "), sin alérgenos, sin números de menú y sin el pan.
${texto ? "TEXTO:\n" + texto.slice(0, 40000) : ""}
Responde SOLO con JSON: {"nombre":"nombre del colegio o comedor si aparece, si no vacío","semanas":[["lunes","martes","miércoles","jueves","viernes"]]}`, opts);
    const semanas = (r?.semanas || []).filter(Array.isArray).map(w => DIAS.slice(0, 5).map((_, i) => String(w[i] || ""))).filter(w => w.some(Boolean));
    if (!semanas.length) throw { message: "No he encontrado un menú semanal en ese archivo." };
    S.draft.comedor.semanas = semanas;
    if (r.nombre && !S.draft.comedor.nombre) S.draft.comedor.nombre = r.nombre;
    S.draft.comedor.ref = { lunes: proximoLunes(), n: 1 };
    S.abierta = 0;
    S.importMsg = { msg: `Leídas ${semanas.length} semanas. Revísalas, di qué semana toca y pulsa Guardar.` };
  } catch (e) {
    S.importMsg = { err: true, msg: mensajeIA(e) };
  }
  render(true);
}

document.addEventListener("click", async e => {

  const b = e.target.closest("[data-act]"); if (!b) return;

  const s = semanaActual();
  if (act === "cerrar-error") { S.error = null; render(); }
  if (act === "cerrar-gen") { S.gen = null; render(); }
  if (act === "swap") cambiarPlato(Number(b.dataset.i), b.dataset.slot, "");
  if (act === "regen-compra") regenerarCompra(b.dataset.ok === "1");
  if (act === "confirm") { S.confirm = b.dataset.que || null; render(true); }
  if (act === "rehacer") rehacerSemana();
  if (act === "estado") await setEstado([b.dataset.item], b.dataset.to);
  if (act === "ver-carrito") { S.verCarrito = !S.verCarrito; render(true); if (S.verCarrito) window.scrollTo({ top: 0, behavior: "smooth" }); }
  if (act === "terminar") { S.verCarrito = false; await setEstado(itemsActuales().filter(i => i.estado === "carrito").map(i => i.id), "comprado"); }
  if (act === "quitar-desp") await store.del("despensa/" + b.dataset.id);
  if (act === "calc-nutri") botonNutricion();
  if (act === "ir-ajustes") { S.tab = "ajustes"; render(true); window.scrollTo(0, 0); }
  if (["add-persona", "quitar-persona", "add-tienda", "quitar-tienda", "add-semana", "quitar-semana", "vaciar-comedor"].includes(act)) {
    const d = leerAjustes(), k = Number(b.dataset.k);
    if (act === "add-persona") d.personas.push(NUEVA_PERSONA());
    if (act === "quitar-persona") d.personas.splice(k, 1);
    if (act === "add-tienda") d.tiendas.push({ nombre: "", que: "" });
    if (act === "quitar-tienda") d.tiendas.splice(k, 1);
    if (act === "add-semana") { d.comedor.semanas.push(["", "", "", "", ""]); S.abierta = d.comedor.semanas.length - 1; }
    if (act === "quitar-semana") d.comedor.semanas.splice(k, 1);
    if (act === "vaciar-comedor") { d.comedor.semanas = []; d.comedor.ref = null; }
    S.draft = d; S.guardado = false; render(true);
  }
  if (act === "descartar") { S.draft = null; S.importMsg = null; render(true); }
  if (act === "a-despensa") {
    const comprados = S.items.filter(i => i.estado === "comprado");

    for (const i of comprados) await store.set("despensa/" + uid(), { nombre: i.nombre, cantidad: `${i.cantidad} ${i.unidad}`.trim(), lugar: lugar(i), semana: s.id });
    S.tab = "despensa"; render();
  }
});

document.addEventListener("change", async e => {
  const t = e.target; const s = semanaActual();
  if (t.id === "sel-semana") { selectSemana(t.value); return; }
  if (t.id === "ver-nutri") { S.verNutri = t.checked; try { localStorage.setItem("cd-nutri", t.checked ? "1" : "0"); } catch (x) {} render(true); return; }
  if (t.id === "co-file" && t.files?.[0]) { importarComedor(t.files[0]); return; }
  if (t.id === "g-lunes" && t.value) { const sel = document.getElementById("g-comedor"); if (sel && sel.value !== "0") sel.value = String(semanaComedor(t.value)); }
  if (t.id === "g-lunes" || t.id === "g-comedor") {
    const n = Number(document.getElementById("g-comedor").value), pv = document.getElementById("g-comedor-prev");
    if (pv) pv.textContent = previewComedor(n);
    return;
  }
  if (t.dataset.step != null && s) {
    const set = new Set(s.batchHecho || []); const i = Number(t.dataset.step);
    t.checked ? set.add(i) : set.delete(i);
    await updateSemana(s, { batchHecho: [...set] });
  }
  if (t.dataset.shop && s) {
    const gastos = Object.assign({}, s.gastos || {}); const v = parseFloat(t.value);
    if (isNaN(v)) delete gastos[t.dataset.shop]; else gastos[t.dataset.shop] = Math.round(v * 100) / 100;
    await updateSemana(s, { gastos });
  }
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "form-gen") {
    document.activeElement?.blur(); S.genOpen = false; S.genLunes = null;
    const n = hayComedor() ? Number(f.querySelector("#g-comedor")?.value || 0) : 0;
    const dias = n ? S.config.comedor.semanas[n - 1] : [];
    generarSemana({ lunes: f.querySelector("#g-lunes").value, comedorSemana: n, comedorDias: dias,
      comedor: dias.map((x, i) => DIAS[i] + ": " + x).join("\n"), peticiones: f.querySelector("#g-pet").value.trim() });
  }
  if (f.id === "form-voz") {
    const texto = f.querySelector("#d-voz").value.trim(); if (!texto) return;
    document.activeElement?.blur();
    await despensaPorVoz(texto);
    return;
  }
  if (f.id === "form-desp") {
    const nombre = f.querySelector("#d-nombre").value.trim(); if (!nombre) return;
    await store.set("despensa/" + uid(), { nombre, cantidad: f.querySelector("#d-cant").value.trim(), lugar: f.querySelector("#d-lugar").value });
    f.querySelector("#d-nombre").value = ""; f.querySelector("#d-cant").value = "";
    render(true);
  }
  if (f.id === "form-add-item") {
    const s = semanaActual(); const nombre = f.querySelector("#ai-nombre").value.trim(); if (!nombre || !s) return;
    const nuevo = { nombre, cantidad: f.querySelector("#ai-cant").value.trim(), unidad: "", tienda: f.querySelector("#ai-tienda").value, seccion: "Añadido a mano", precio: parseFloat(f.querySelector("#ai-precio").value) || 0, para: "", estado: "pendiente", orden: 999 };
    f.reset(); document.activeElement?.blur();
    if (s.ejemplo) { EJ_ITEMS.push(Object.assign({ id: "e" + uid() }, nuevo)); render(true); return; }
    await store.set(`semanas/${s.id}/compra/999-${uid()}`, nuevo);
  }
  if (f.id === "form-ajustes") {
    const d = leerAjustes();
    d.personas = d.personas.map((p, k) => Object.assign(p, { nombre: p.nombre || "Persona " + (k + 1) }));
    d.tiendas = d.tiendas.filter(t => t.nombre);
    S.config = normalizar(d); S.draft = null; S.importMsg = null; S.guardado = true;
    await saveConfig(); document.activeElement?.blur(); render(true);
  }
});

// Cualquier cambio en ajustes se guarda como borrador para no perderlo si la pantalla se redibuja
document.addEventListener("input", e => {
  if (e.target.closest?.("#form-ajustes") && e.target.id !== "co-file") { S.draft = leerAjustes(); S.guardado = false; }
});

function selectSemana(id) {
  S.semanaId = id;
  if (unsubItems) { try { unsubItems(); } catch (e) {} unsubItems = null; }
  S.items = [];
  if (id && id !== "ejemplo") unsubItems = store.watchCol(`semanas/${id}/compra`, rows => { S.items = rows.map(r => Object.assign({ id: r.id }, r.data)); render(); }) || null;
  render();
}

/* =========================================================
   Arranque
   ========================================================= */
function start() {
  try { const t = localStorage.getItem("cd-tab"); if (t) S.tab = t; if (localStorage.getItem("cd-nutri") === "0") S.verNutri = false; } catch (e) {}
  store.watchDoc("config/hogar", c => {
    S.config = normalizar(c);
    render();
  });
  store.watchCol("despensa", rows => { S.despensa = rows; render(); });
  store.watchDoc("precios/mercadona", d => { S.precios = d; render(); });
  store.watchCol("semanas", rows => {
    S.semanas = rows;
    if (!S.semanaId || (S.semanaId === "ejemplo" && rows.length) || (S.semanaId !== "ejemplo" && !rows.some(r => r.id === S.semanaId))) {
      const latest = rows.slice().sort((a, b) => b.id.localeCompare(a.id))[0];
      selectSemana(latest ? latest.id : "ejemplo");
    } else render();
  });
}

render();
(async () => {
  const claude = window.claude;
  if (claude && typeof claude.use === "function") {
    const [d, sm] = await Promise.all([claude.use("db").catch(() => null), claude.use("sample").catch(() => null)]);
    db = d; sample = sm; shared = !!d;
  }
  start();
})();
</script>
